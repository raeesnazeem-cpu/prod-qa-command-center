# Local AWS emulator for the QACC AWS move (docs/aws-floci-migration-plan.md §5).
# Start:  docker compose -f infra/floci/docker-compose.floci.yml up -d
# Fallback app containers (if floci can't run a piece) get added here, on the same network.
name: qacc-floci

services:
  floci:
    image: floci/floci:2.3.0
    container_name: floci
    user: root
    ports:
      - "4566:4566"
      # ALB listener sockets bind inside floci; HTTP :80 -> host :8088
      - "8088:80"
      # ElastiCache proxy, for api/worker under `pnpm dev` (host 6379 is often a local Redis)
      - "127.0.0.1:6380:6379"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.data:/app/data
    environment:
      FLOCI_STORAGE_MODE: persistent
      # Default RDS image has no pgvector; the embeddings table needs it.
      FLOCI_SERVICES_RDS_DEFAULT_POSTGRES_IMAGE: pgvector/pgvector:pg16
      FLOCI_HOSTNAME: floci
      # Containers in one awsvpc task share a network namespace (sidecar on localhost),
      # like real Fargate. Without this each container gets its own IP.
      FLOCI_NETWORK_SECURITY_GROUP_ENFORCEMENT_ENABLED: "true"
      FLOCI_SERVICES_ECS_DOCKER_NETWORK: qacc-floci
      # Use an image already on this Docker daemon (tagged with its ECR name) instead
      # of pulling from floci's registry: the worker image is ~6.6 GB and a second
      # copy in the registry doesn't fit on a laptop. Real AWS always pulls from ECR.
      FLOCI_SERVICES_ECS_IMAGE_PULL_BEHAVIOR: prefer-cached
    networks:
      - qacc

  # PostgREST for running api/worker with `pnpm dev` against floci RDS (Phase 3).
  # In ECS this runs as a sidecar instead. Local-only secrets; RDS proxy port may differ
  # per instance — check `aws.sh rds describe-db-instances`.
  postgrest:
    image: postgrest/postgrest:v12.2.12
    container_name: qacc-postgrest
    profiles: ["dev"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:authpw123@floci:7001/qacc
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: local-floci-jwt-secret-at-least-32-chars!!
      PGRST_DB_POOL: "10"
    networks:
      - qacc

networks:
  qacc:
    name: qacc-floci

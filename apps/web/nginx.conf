server {
  listen 80;
  root /usr/share/nginx/html;

  # ALB health check
  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Hashed build assets can be cached for good.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/projects/..., /sso) fall back to the SPA.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
